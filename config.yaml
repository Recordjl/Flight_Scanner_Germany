# Flight Scanner Germany - trip and alert settings
trip:
  origin: CVG
  destinations: [MUC, STR]
  depart_start: 2027-09-16
  depart_end: 2027-09-29
  min_nights: 10
  max_nights: 14

passengers:
  adults: 2
  children: 1          # age 2 with own seat: a "child" fare, and full miles on most award programs

# Mixed cabin: 1 business seat + 2 economy seats on the same flights, both directions.
# No API can price this as one booking, so it is priced as separate searches and summed.
# All-economy (3 seats) is tracked as well.

# Push alert thresholds. Everything else goes in the daily summary only.
thresholds:
  economy_cash_per_person_rt: 900
  business_cash_per_person_rt: 3500
  economy_award_miles_one_way: 30000
  business_award_miles_one_way: 70000
  alert_on_new_low: true

awards:
  # CVG has little cached award data, so US hubs are searched too (needs a separate CVG->hub ticket).
  us_airports: [CVG, ORD, EWR, IAD, ATL, DTW, JFK, BOS]
  # FRA/ZRH are ~3-4h by train to Munich/Stuttgart.
  europe_airports: [MUC, STR, FRA, ZRH]
  # Programs reachable with Amex / Chase / Capital One / Citi transfers or Delta SkyMiles.
  # Names are seats.aero "Source" values; results from other programs are logged and ignored.
  programs: [delta, flyingblue, virginatlantic, aeroplan, united, lifemiles, turkish,
             singapore, etihad, qatar, finnair, american]
  include_filtered: true   # include dynamically priced space (most Delta awards are dynamic)
  min_cabin_pct: 75        # allow an economy feeder leg (e.g. CVG-ORD) on a business award
  trip_details_max: 15     # /trips lookups for alert candidates (flight numbers, booking links)

cash:
  # SerpAPI free tier = 250 searches/month. Each date pair costs 3 searches
  # (1 adult business, 1 adult + child economy, 2 adults + child economy).
  date_pairs_per_run: 2
  rotation_nights: [10, 12, 14]
  # Google Flights only returns fares once the RETURN date is inside the airline schedule.
  # Searches beyond this many days out are skipped (empty results may still be billed).
  horizon_days: 330

reddit:
  # Public RSS feeds (Reddit no longer self-serves API apps). Skipped quietly if blocked.
  subreddits: [awardtravel, churning, delta, flights]
  # A post must mention at least one place; topics are shown alongside but never match alone.
  places: [MUC, Munich, München, STR, Stuttgart, Germany, Frankfurt, FRA, Zurich, Oktoberfest, Bavaria]
  topics: [Lufthansa, "Delta One", "Flying Blue", "Promo Rewards", Aeroplan, "Virgin Atlantic",
           "Premium Select", business, saver]
  lookback_hours: 26
  seconds_between_requests: 30
